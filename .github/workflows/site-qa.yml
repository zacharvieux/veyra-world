name: Veyra Site QA

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - world-guide-build

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static site QA
        run: python scripts/qa_site.py
